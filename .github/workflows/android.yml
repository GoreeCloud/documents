name: Android offline client validation
on:
  push:
    paths:
      - "android/**"
      - "tools/check_android_permissions.py"
      - "tools/android_device_preflight.py"
      - "tools/extract_android_ci_debug_apk.py"
      - "tests/test_android_*.py"
      - "tests/test_workflow_action_pins.py"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "tools/check_android_permissions.py"
      - "tools/android_device_preflight.py"
      - "tools/extract_android_ci_debug_apk.py"
      - "tests/test_android_*.py"
      - "tests/test_workflow_action_pins.py"
      - ".github/workflows/android.yml"
concurrency:
  group: android-documents-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'
      - name: Prepare Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "8.10.2"
      - name: Verify Android codec and compile debug app
        run: gradle -p android :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Fetch reviewed GoreeCloud APK integrity tooling at pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: GoreeCloud/android-toolkit
          ref: 70655c1c210984bc72a4a93436eaf8a6e3c59d8b
          path: gc-toolkit
          persist-credentials: false
      - name: Inspect tracked source, APK archive, debug signature and package ID
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          test "$(git -C gc-toolkit rev-parse HEAD)" = '70655c1c210984bc72a4a93436eaf8a6e3c59d8b'
          python3 gc-toolkit/tools/audit_tracked.py --root "$GITHUB_WORKSPACE"
          python3 gc-toolkit/tools/apk_inspect.py "$apk"
          signer="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          aapt="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          test -x "$signer"
          test -x "$aapt"
          "$signer" verify --verbose "$apk"
          "$aapt" dump badging "$apk" | grep -F "package: name='com.goreecloud.documents'"
          "$aapt" dump badging "$apk" | grep -F "sdkVersion:'26'"
          "$aapt" dump badging "$apk" | grep -F "targetSdkVersion:'35'"
          # No platform permissions; allow only AndroidX's exact internal
          # non-exported dynamic-receiver permission. Fail on any other use.
          "$aapt" dump permissions "$apk" | python3 tools/check_android_permissions.py
          sha256sum "$apk"
          echo "Debug APK and its offline permissions inspected; no release artifact delivered."
      - name: Stage the verified CI debug APK and build checksum
        run: |
          set -euo pipefail
          original=android/app/build/outputs/apk/debug/app-debug.apk
          folder="$RUNNER_TEMP/goreecloud-documents-debug"
          mkdir -p "$folder"
          name="GoreeCloud-Documents-0.1.0-dev-${GITHUB_SHA}-CI-debug.apk"
          install -m 0644 "$original" "$folder/$name"
          cmp "$original" "$folder/$name"
          (cd "$folder" && sha256sum "$name" > SHA256SUMS.txt)
          echo "Temporary GitHub ZIP artifact prepared. This is NOT standalone Drive APK delivery."
      - name: Retain short-lived debug transport ZIP for verified extraction
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: goreecloud-documents-ci-debug-${{ github.sha }}
          path: ${{ runner.temp }}/goreecloud-documents-debug/
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

  android-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "8.10.2"
      - name: Install isolated Android 35 emulator image
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" emulator "system-images;android-35;google_apis;x86_64"
          echo "no" | avdmanager create avd --force --name goreedocs-ci --package "system-images;android-35;google_apis;x86_64"
      - name: Launch emulator and wait for device readiness
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          test -x "$ANDROID_SDK_ROOT/emulator/emulator"
          nohup "$ANDROID_SDK_ROOT/emulator/emulator" -avd goreedocs-ci -no-window -no-audio -no-boot-anim -no-snapshot-save -gpu swiftshader_indirect -accel on -memory 2048 > "$RUNNER_TEMP/goreedocs-emulator.log" 2>&1 &
          emulator_pid=$!
          sleep 5
          if ! kill -0 "$emulator_pid" 2>/dev/null; then
            tail -100 "$RUNNER_TEMP/goreedocs-emulator.log"
            exit 1
          fi
          timeout 300 adb wait-for-device
          timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 5; done'
          adb shell input keyevent 82
          adb devices
      - name: Test native Activity lifecycle and app-private Save on emulator
        run: gradle -p android :app:connectedDebugAndroidTest --no-daemon
      - name: Verify a committed private record across actual emulator force-stop and relaunch
        run: |
          set -euo pipefail
          # All files, credentials, packages and runtime processes here belong to
          # this disposable Android 35 GitHub Actions emulator only.
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test_apk=android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          test -s "$apk"
          test -s "$test_apk"
          adb install -r "$apk"
          adb install -r "$test_apk"
          runner='com.goreecloud.documents.test/androidx.test.runner.AndroidJUnitRunner'
          case_name='com.goreecloud.documents.ProcessDeathDurabilityTest#committedRecordSurvivesHostDrivenForceStop'
          adb shell am instrument -w -r -e class "$case_name" -e gcdocs.phase seed "$runner" | tee "$RUNNER_TEMP/gcdocs-process-seed.log"
          grep -F 'OK (1 test)' "$RUNNER_TEMP/gcdocs-process-seed.log"
          adb shell am start -W -n com.goreecloud.documents/.MainActivity
          timeout 30 bash -c 'until adb shell pidof com.goreecloud.documents >/dev/null; do sleep 1; done'
          adb shell am force-stop com.goreecloud.documents
          if adb shell pidof com.goreecloud.documents >/dev/null; then
            echo 'ERROR: application still running after force-stop'
            exit 1
          fi
          adb shell am start -W -n com.goreecloud.documents/.MainActivity
          timeout 30 bash -c 'until adb shell pidof com.goreecloud.documents >/dev/null; do sleep 1; done'
          adb shell am instrument -w -r -e class "$case_name" -e gcdocs.phase verify "$runner" | tee "$RUNNER_TEMP/gcdocs-process-verify.log"
          grep -F 'OK (1 test)' "$RUNNER_TEMP/gcdocs-process-verify.log"
          echo 'Isolated force-stop/relaunch and committed-record verification passed.'

      - name: Report emulator diagnostics if tests fail
        if: failure()
        run: |
          adb devices || true
          tail -150 "$RUNNER_TEMP/goreedocs-emulator.log" || true
