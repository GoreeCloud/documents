name: Android offline client validation
on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Prepare Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Verify Android codec and compile debug app
        run: gradle -p android :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Report package without distributing an APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          echo "Android compile and unit tests passed; APK is not a delivered artifact."
