name: Documents validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate Python and API
        run: |
          python -m compileall -q goreedocs
          python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check browser scripts
        run: |
          node --check web/app.js
          node --check web/share.js

  linux-gtk-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install system GTK4 and X11 test display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-gi gir1.2-gtk-4.0 xvfb
      - name: Launch the native GTK window under Xvfb
        env:
          GOREEDOCS_TOKEN: ci-only-placeholder
        run: |
          xvfb-run -a /usr/bin/python3 - <<'PY'
          import os
          import subprocess
          import time

          process = subprocess.Popen(
              ["/usr/bin/python3", "-m", "goreedocs.linux"],
              env=os.environ.copy(), stdout=subprocess.PIPE,
              stderr=subprocess.PIPE, text=True,
          )
          try:
              time.sleep(3)
              if process.poll() is not None:
                  stdout, stderr = process.communicate()
                  raise SystemExit(
                      "GTK application exited before runtime smoke check:\\n" + stderr
                  )
              print("Native GTK4 window remained running under the virtual display")
          finally:
              process.terminate()
              try:
                  process.communicate(timeout=6)
              except subprocess.TimeoutExpired:
                  process.kill()
                  process.communicate()
          PY
