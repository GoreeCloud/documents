name: Documents validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate Python and API
        run: |
          python -m compileall -q goreedocs
          python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check browser scripts
        run: |
          node --check web/app.js
          node --check web/share.js

  linux-gtk-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install system GTK4 and X11 test display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-gi gir1.2-gtk-4.0 xvfb
      - name: Launch the native GTK window under Xvfb
        env:
          GOREEDOCS_TOKEN: ci-only-placeholder
        run: |
          xvfb-run -a /usr/bin/python3 - <<'PY'
          import os
          import subprocess
          import time

          process = subprocess.Popen(
              ["/usr/bin/python3", "-m", "goreedocs.linux"],
              env=os.environ.copy(), stdout=subprocess.PIPE,
              stderr=subprocess.PIPE, text=True,
          )
          try:
              time.sleep(3)
              if process.poll() is not None:
                  stdout, stderr = process.communicate()
                  raise SystemExit(
                      "GTK application exited before runtime smoke check:\\n" + stderr
                  )
              print("Native GTK4 window remained running under the virtual display")
          finally:
              process.terminate()
              try:
                  process.communicate(timeout=6)
              except subprocess.TimeoutExpired:
                  process.kill()
                  process.communicate()
          PY

      - name: Exercise registered native GTK4 window actions
        env:
          GOREEDOCS_TOKEN: ""
        run: |
          xvfb-run -a /usr/bin/python3 - <<'PY'
          import gi
          gi.require_version("Gtk", "4.0")
          from gi.repository import Gio, GLib, Gtk
          from goreedocs import linux

          results = []
          # GTK canonicalizes Primary to Control under Linux/X11.
          expected = {
              "new-document": "<Control>n",
              "save-document": "<Control>s",
              "search-documents": "<Control>f",
              "focus-editor": "<Control>e",
              "refresh-library": "F5",
          }

          def inspect():
              app = Gio.Application.get_default()
              if app is None:
                  results.append("GTK application did not register")
                  return False
              try:
                  window = app.get_active_window()
                  if window is None:
                      raise AssertionError("No active native window")
                  for name, shortcut in expected.items():
                      action = window.lookup_action(name)
                      if action is None:
                          raise AssertionError("Missing native action: " + name)
                      accelerators = app.get_accels_for_action("win." + name)
                      if shortcut not in accelerators:
                          raise AssertionError(
                              f"Missing keyboard shortcut for {name}: {accelerators}"
                          )
                  # Without a token, the masked login field owns initial focus.
                  # Do not claim search can be used before authentication.
                  focus = window.get_focus()
                  found_masked_login = False
                  while focus is not None:
                      if isinstance(focus, Gtk.Entry) and not focus.get_visibility():
                          found_masked_login = True
                          break
                      focus = focus.get_parent()
                  if not found_masked_login:
                      raise AssertionError("No focused masked owner-token field")
                  results.append("Native GTK4 window actions and masked login passed")
              except Exception as error:
                  results.append("Failed: " + str(error))
              finally:
                  app.quit()
              return False

          GLib.timeout_add(1200, inspect)
          status = linux.main(["goreecloud-documents"])
          if status != 0 or results != ["Native GTK4 window actions and masked login passed"]:
              raise SystemExit(f"Native action runtime check failed: {status} {results}")
          print(results[0])
          PY

  linux-debian-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install native GTK4 runtime and virtual display on disposable runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-gi gir1.2-gtk-4.0 xvfb xdotool
      - name: Build and inspect offline Debian package
        run: |
          python3 packaging/linux/build_deb.py
          file='dist/goreecloud-documents_0.1.0~dev1_all.deb'
          test -s "$file"
          test "$(dpkg-deb -f "$file" Package)" = goreecloud-documents
          test "$(dpkg-deb -f "$file" Architecture)" = all
          dpkg-deb --contents "$file" | grep 'usr/share/applications/com.goreecloud.Documents.desktop'
          dpkg-deb --contents "$file" | grep 'usr/share/doc/goreecloud-documents/LICENSE.GC-UI'
          if python3 packaging/linux/build_deb.py; then
            echo "ERROR: packager unexpectedly overwrote an existing package"
            exit 1
          fi
      - name: Test native package install, startup and uninstall
        env:
          GOREEDOCS_TOKEN: ci-only-placeholder
        run: |
          sudo dpkg --install 'dist/goreecloud-documents_0.1.0~dev1_all.deb'
          test -x /usr/bin/goreecloud-documents
          xvfb-run -a /usr/bin/python3 - <<'PY'
          import os
          import subprocess
          import time
          for with_token in (True, False):
              runtime_env = os.environ.copy()
              if not with_token:
                  runtime_env.pop("GOREEDOCS_TOKEN", None)
              process = subprocess.Popen(
                  ["/usr/bin/goreecloud-documents"],
                  cwd="/tmp", env=runtime_env,
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,
              )
              try:
                  time.sleep(3)
                  if process.poll() is not None:
                      out, err = process.communicate()
                      raise SystemExit("Packaged GTK4 process exited during startup:\\n" + err)
                  window = subprocess.run(
                      ["xdotool", "search", "--name", "GoreeCloud Documents"],
                      capture_output=True, text=True, check=False,
                  )
                  if window.returncode != 0 or not window.stdout.strip():
                      raise SystemExit(
                          "Installed GTK4 client did not create a named window"
                      )
                  print("Installed GTK4 window visible, environment token:", with_token)
              finally:
                  process.terminate()
                  try:
                      process.communicate(timeout=6)
                  except subprocess.TimeoutExpired:
                      process.kill()
                      process.communicate()
          PY
          sudo dpkg --remove goreecloud-documents
          test ! -e /usr/bin/goreecloud-documents
